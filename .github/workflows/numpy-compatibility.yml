name: NumPy compatibility

on:
  push:
  pull_request:

jobs:
  numerics:
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            numpy-version: "1.22.3"
          - python-version: "3.12"
            numpy-version: "2.*"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==${{ matrix.numpy-version }}" pytest
          python -m pip install --no-deps -e .
      - name: Run numerical compatibility tests
        run: python -m pytest tests/unit/test_numerics.py tests/unit/test_calibration_targets.py
